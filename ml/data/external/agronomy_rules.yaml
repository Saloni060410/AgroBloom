# Rule-layer parameters for the NPK calculator / dosage-adjustment engine (contract C5,
# Richa + Saloni). Formula: fertilizer needed = standard dose (reference_doses.csv) +
# soil-test adjustment (soil_adjustments.csv) - credit from recent applications (this file's
# credit_window_days, plus nutrient_efficiency.csv's fertilizer_use_efficiency). Every key
# below has a source comment or the words "team assumption".

credit_window_days: 60
  # team assumption -- placeholder. Number of days a previous fertilizer application is
  # still credited against (subtracted from) the current recommendation's nutrient need.
  # credit_kg_ha = prior_application_kg_ha * nutrient_efficiency.csv's fertilizer_use_efficiency.
  # NOT the same thing as a crop's growing-season length (a real season is often much
  # longer than 60 days -- wheat: 148-158 days; barley: 137-146 days) -- do not reuse this
  # key as a same-season proxy. For "is this application in the current crop cycle",
  # ml/src/data_pipeline/feature_engineering.py's season_length_days(tables, crop_id) gives
  # a real, sourced season length from growth_stages.csv's maturity/harvest stage where one
  # exists (only wheat and barley have one so far), falling back to this credit_window_days
  # value ONLY when no sourced season length exists yet, and only with an explicit warning
  # (see risk_analyzer.assess_recommendation, which already does this) -- never silently.
  # Saloni's compare_to_history (ml/src/engine/cost.py, not yet written) needs the same
  # same-season vs credit-window distinction; reuse season_length_days() rather than
  # re-deriving it or reusing credit_window_days as a season proxy there too.

rain_hold_mm: 20
  # team assumption -- placeholder. Forecast rainfall (mm) above which nitrogen top-dressing
  # is held to avoid runoff loss (see PAU POP rice/wheat guidance: "apply split N when water
  # is not standing in the field" -- PAU POP Kharif 2026 p.9, PAU POP Rabi 2025-26 p.10 --
  # confirms the practice qualitatively; the mm threshold itself is a team assumption).

rain_hold_days: 2
  # team assumption -- placeholder. Number of days to delay a scheduled split after a
  # rain-hold trigger.

over_application_ratio_medium: 1.25
  # team assumption -- placeholder. Actual-to-computed-need nutrient ratio above which
  # risk.level is flagged "medium".

over_application_ratio_high: 1.5
  # team assumption -- placeholder. Actual-to-computed-need nutrient ratio above which
  # risk.level is flagged "high".

under_application_ratio: 0.75
  # team assumption -- placeholder. Actual-to-computed-need nutrient ratio below which the
  # recommendation flags under-application (yield-risk direction, not just over-use/runoff).

formula_tolerance_pct: 10
  # team assumption -- placeholder. Percent tolerance band used by the sanity test /
  # evaluation.formula_conformity() to count a computed recommendation as consistent with
  # the reference_doses.csv + soil_adjustments.csv + nutrient_efficiency.csv formula output.

# --- History rules (rainfall, earlier soil tests, crop stage). Added with the history work; every
# value below is a team assumption pending agronomist sign-off, in line with the keys above. None of
# them changes a published dose: they decide how much past fertilizer is credited, when top-dressing
# is held, and which earlier-test observations are worth telling the farmer.

credit_window_pk_uses_season: true
  # team assumption. Phosphorus and potassium applied to a crop stay in the soil (they are not
  # washed out the way nitrogen is), so they are credited for the crop's whole season where a sourced
  # season length exists (feature_engineering.season_length_days: wheat, barley), and for
  # credit_window_days otherwise. Nitrogen always uses credit_window_days. Set to false to give every
  # nutrient the flat credit_window_days.

rain_loss_mm: 20
  # team assumption -- placeholder, same value as rain_hold_mm. Rain (mm) in the rain_loss_days after
  # a nitrogen application at or above which part of that nitrogen is taken to have washed out.
  # Needs daily rainfall history from the backend (rainfall_history); without it nothing is reduced.

rain_loss_days: 3
  # team assumption. Days from the day of application (inclusive) over which that rain is summed.

rain_loss_credit_factor: 0.5
  # team assumption -- the least well supported number here. Multiplier on the nitrogen credit of an
  # application followed by rain_loss_mm within rain_loss_days. The practice is qualitative in the PAU
  # package (do not top-dress before heavy rain); the 0.5 itself is not sourced. Every reduction is
  # shown to the farmer as a note, never applied silently.

recent_rain_hold_days: 2
  # team assumption. If rain_hold_mm or more actually fell in the last this-many days, nitrogen
  # top-dressing is held as it is for forecast rain (saturated soil loses nitrogen the same way).

soil_jump_ratio: 2.0
  # team assumption. A nitrogen, phosphorus or potassium reading at least this many times higher (or
  # this fraction lower, i.e. 1/2.0) than the previous soil test is flagged as a possible misread,
  # because soil nutrients do not move that fast between tests. A data-quality warning only.

soil_jump_ph: 1.0
  # team assumption. A pH change of at least this many units since the previous test is flagged.

soil_jump_oc: 0.3
  # team assumption. An organic carbon change of at least this many percentage points since the
  # previous test is flagged.

soil_jump_days: 400
  # team assumption. Only a previous test newer than this many days is compared for jumps.

oc_trend_min_tests: 3
  # team assumption. Tests needed (including the latest) before an organic carbon trend is reported.

oc_trend_drop: 0.05
  # team assumption. Organic carbon fall (percentage points) from the oldest to the latest of those
  # tests, with no rise in between, that is reported as "falling".

# --- Soil-test bands (the fallback for nutrients PAU gives no adjustment for) ---
soil_rating_fallback:
  # Where the Punjab Agricultural University publishes no soil-test adjustment for a crop's nutrient
  # (wheat N and P, rice N, maize N P K ... see the TODO(data) rows in soil_adjustments.csv), the dose
  # follows the soil's rating BAND instead: one dose anywhere inside a band, a different one in the next
  # band. A crop-specific PAU adjustment, where one exists, always wins and this never touches it.
  # Rating bands come from soil_test_ratings.csv (ICAR-IISS Bhopal: N low <280, high >560; P low <10,
  # high >25; K low <108, high >280 kg/ha). Set enabled to false to go back to the plain standard dose.
  # Sources, the general ICAR method used across India (not PAU-specific):
  #   Rajendiran S, Dotaniya ML, Vassanda Coumar M (2020), Indian Farming, March 2020, ICAR-DRMR:
  #     medium fertility is the general recommended dose; "in low or high categories, the fertilizer doses
  #     are raised or lowered by 25%". The paper also notes the weakness of bands: one dose for a whole band.
  #   Singh J, Mavi MS, Saini SP (2022), Indian J. Agric. Sci. 92(12):1502-1505, PAU Ludhiana,
  #     doi 10.56093/ijas.v92i12.125137: same rule, "increased or decreased by 25% respectively".
  # team assumption -- applying it to every crop and nutrient with no PAU table is our choice, and wants
  # an agronomist's sign-off, especially for nitrogen, which PAU recommends at a fixed dose.
  enabled: true
  factors:
    very_low: 1.25
    low: 1.25
    medium: 1.0
    high: 0.75
