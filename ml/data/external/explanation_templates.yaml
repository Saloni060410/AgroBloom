# Plain-language explanation templates (contract C6). template_id -> {en, hi} sentence with
# {placeholders}. Saloni's rule_trace emits rule_id values; Richa's explain() (R10) maps them
# here. R8 (risk_analyzer.py) adds the risk.* keys below; the full rule_trace set (every
# rule_id the NPK calculator emits) lands in R10. Sentences never blame the farmer and always
# include the numbers that drove the result.

low_k_soil_test_adjustment:
  en: "Soil potassium is low ({value} kg/ha), so {adjustment} kg/ha of extra potash was added to the standard dose."
  hi: "मिट्टी में पोटैशियम की मात्रा कम है ({value} किग्रा/हेक्टेयर), इसलिए मानक खुराक में {adjustment} किग्रा/हेक्टेयर अतिरिक्त पोटाश जोड़ा गया है।"

# risk.* -- R8 (ml/src/degradation/risk_analyzer.py). Consequence claims (acidification,
# leaching, nutrient antagonism, water-holding capacity, availability curves) are general soil
# science, not crop/region-specific PAU numbers -- e.g. Havlin et al., "Soil Fertility and
# Fertilizers" (standard agronomy reference); ICAR-IISS extension material makes the same
# points for Indian soils specifically. The *numbers* quoted in each sentence come from the
# request/computation, never invented.

risk.over_application.reason:
  en: "Applied {nutrient_label} is {applied} kg/ha, {ratio_pct}% of the {needed} kg/ha the crop needs."
  hi: "लगाया गया {nutrient_label} {applied} किग्रा/हेक्टेयर है, जो फसल की आवश्यकता {needed} किग्रा/हेक्टेयर का {ratio_pct}% है।"
risk.over_application.soil_health_impact:
  en: "Nitrogen applied well beyond crop need can acidify the soil over time and leach into groundwater rather than being taken up by the plant."
  hi: "फसल की आवश्यकता से कहीं अधिक नाइट्रोजन डालने से समय के साथ मिट्टी अम्लीय हो सकती है और यह पौधे द्वारा अवशोषित होने के बजाय भूजल में मिल सकती है।"
risk.over_application.yield_impact:
  en: "Extra fertilizer beyond what the crop can use adds cost without adding yield -- money spent for no extra grain."
  hi: "फसल की जरूरत से अधिक उर्वरक डालने पर उपज बढ़े बिना ही लागत बढ़ जाती है -- अतिरिक्त अनाज के बिना पैसा खर्च होता है।"

risk.over_application_no_need.reason:
  en: "Applied {nutrient_label} is {applied} kg/ha, but the crop needs none of it right now."
  hi: "लगाया गया {nutrient_label} {applied} किग्रा/हेक्टेयर है, जबकि फसल को अभी इसकी आवश्यकता नहीं है।"
risk.over_application_no_need.soil_health_impact:
  en: "A nutrient applied when the crop does not need it is not taken up and can build up in the soil or wash out of it."
  hi: "जिस पोषक तत्व की फसल को जरूरत नहीं है, उसे डालने पर वह पौधे द्वारा अवशोषित नहीं होता और मिट्टी में जमा हो सकता है या बह सकता है।"
risk.over_application_no_need.yield_impact:
  en: "Extra fertilizer beyond what the crop can use adds cost without adding yield -- money spent for no extra grain."
  hi: "फसल की जरूरत से अधिक उर्वरक डालने पर उपज बढ़े बिना ही लागत बढ़ जाती है -- अतिरिक्त अनाज के बिना पैसा खर्च होता है।"

risk.under_application.reason:
  en: "Soil {nutrient_label} tests low, and only {applied} kg/ha was applied against the {needed} kg/ha needed ({ratio_pct}%)."
  hi: "मिट्टी में {nutrient_label} की मात्रा कम है, और आवश्यक {needed} किग्रा/हेक्टेयर के मुकाबले केवल {applied} किग्रा/हेक्टेयर ({ratio_pct}%) डाला गया।"
risk.under_application.soil_health_impact:
  en: "Consistently under-supplying a nutrient the soil is already low in draws down soil fertility further over successive seasons."
  hi: "जिस पोषक तत्व की मिट्टी में पहले से कमी है, उसे लगातार कम मात्रा में देने से आने वाले मौसमों में मिट्टी की उर्वरता और घटती जाती है।"
risk.under_application.yield_impact:
  en: "A nutrient shortfall this large is likely to limit crop growth and reduce yield below what the field could otherwise produce."
  hi: "इतनी बड़ी पोषक तत्व की कमी से फसल की बढ़वार सीमित हो सकती है और खेत जितनी उपज दे सकता था, उससे कम उपज मिल सकती है।"

risk.imbalance.reason:
  en: "{high_nutrient_label} is well above what's needed ({high_ratio_pct}%) while {low_nutrient_label} is well below ({low_ratio_pct}%)."
  hi: "{high_nutrient_label} आवश्यकता से कहीं अधिक ({high_ratio_pct}%) है जबकि {low_nutrient_label} आवश्यकता से कहीं कम ({low_ratio_pct}%) है।"
risk.imbalance.soil_health_impact:
  en: "An imbalanced nutrient supply can interfere with how efficiently the crop takes up the nutrients that are already short."
  hi: "असंतुलित पोषक तत्व आपूर्ति उन पोषक तत्वों के अवशोषण की क्षमता को प्रभावित कर सकती है जिनकी पहले से ही कमी है।"
risk.imbalance.yield_impact:
  en: "Yield is often limited by the scarcest nutrient, not the most abundant one -- the surplus nutrient doesn't compensate for the shortfall."
  hi: "उपज अक्सर सबसे कम पोषक तत्व से सीमित होती है, सबसे अधिक वाले से नहीं -- अतिरिक्त पोषक तत्व कमी की भरपाई नहीं करता।"

risk.imbalance_no_need.reason:
  en: "{high_nutrient_label} was applied although the crop needs none of it, while {low_nutrient_label} is well below what's needed ({low_ratio_pct}%)."
  hi: "फसल को {high_nutrient_label} की आवश्यकता नहीं होने पर भी इसे डाला गया, जबकि {low_nutrient_label} आवश्यकता से कहीं कम ({low_ratio_pct}%) है।"
risk.imbalance_no_need.soil_health_impact:
  en: "An imbalanced nutrient supply can interfere with how efficiently the crop takes up the nutrients that are already short."
  hi: "असंतुलित पोषक तत्व आपूर्ति उन पोषक तत्वों के अवशोषण की क्षमता को प्रभावित कर सकती है जिनकी पहले से ही कमी है।"
risk.imbalance_no_need.yield_impact:
  en: "Yield is often limited by the scarcest nutrient, not the most abundant one -- the surplus nutrient doesn't compensate for the shortfall."
  hi: "उपज अक्सर सबसे कम पोषक तत्व से सीमित होती है, सबसे अधिक वाले से नहीं -- अतिरिक्त पोषक तत्व कमी की भरपाई नहीं करता।"

risk.low_organic_carbon.reason:
  en: "Soil organic carbon tests low ({value}%)."
  hi: "मिट्टी में जैविक कार्बन की मात्रा कम है ({value}%)।"
risk.low_organic_carbon.soil_health_impact:
  en: "Low organic carbon reduces the soil's water-holding capacity and nutrient-retention ability, making the soil more vulnerable to degradation over time."
  hi: "कम जैविक कार्बन मिट्टी की जल धारण क्षमता और पोषक तत्व बनाए रखने की क्षमता को कम करता है, जिससे मिट्टी समय के साथ अधिक कमजोर हो सकती है।"
risk.low_organic_carbon.yield_impact:
  en: "Soils low in organic carbon typically respond less efficiently to applied fertilizer, so the same dose may deliver less yield benefit."
  hi: "कम जैविक कार्बन वाली मिट्टी आमतौर पर डाले गए उर्वरक का कम प्रभावी उपयोग करती है, इसलिए वही खुराक कम उपज लाभ दे सकती है।"

risk.ph_out_of_band.reason:
  en: "Soil pH is {value}, outside the {low_below}-{high_above} range most nutrients are readily available in."
  hi: "मिट्टी का pH {value} है, जो {low_below}-{high_above} की उस सीमा से बाहर है जिसमें अधिकांश पोषक तत्व आसानी से उपलब्ध होते हैं।"
risk.ph_out_of_band.soil_health_impact:
  en: "At this pH, some nutrients become chemically less available to the crop even if enough is present in the soil."
  hi: "इस pH पर, कुछ पोषक तत्व मिट्टी में पर्याप्त मात्रा में होने के बावजूद फसल के लिए रासायनिक रूप से कम उपलब्ध हो जाते हैं।"
risk.ph_out_of_band.yield_impact:
  en: "Fertilizer applied under an unfavourable pH is used less efficiently by the crop, so yield response can fall short of what the dose would normally give."
  hi: "प्रतिकूल pH में डाला गया उर्वरक फसल द्वारा कम प्रभावी ढंग से उपयोग होता है, इसलिए उपज में वृद्धि सामान्य से कम हो सकती है।"

risk.runoff.reason:
  en: "{rainfall} mm of rain is forecast around the time nitrogen would be applied."
  hi: "जिस समय नाइट्रोजन डाला जाना है उसके आसपास {rainfall} मिमी बारिश का अनुमान है।"
risk.runoff.soil_health_impact:
  en: "Nitrogen applied just before heavy rain is prone to washing off the field or leaching past the root zone instead of being taken up."
  hi: "भारी बारिश से ठीक पहले डाला गया नाइट्रोजन खेत से बह जाने या जड़ क्षेत्र से नीचे निकल जाने की संभावना रखता है, बजाय पौधे द्वारा अवशोषित होने के।"
risk.runoff.yield_impact:
  en: "Nitrogen lost to runoff before the crop can use it means less of the applied dose actually reaches the plant."
  hi: "फसल द्वारा उपयोग किए जाने से पहले बह जाने वाला नाइट्रोजन का मतलब है कि डाली गई खुराक का कम हिस्सा पौधे तक पहुंच पाता है।"

risk.healthy.reason:
  en: "Applied and needed amounts are close across all nutrients, with no soil-health or runoff concerns flagged."
  hi: "सभी पोषक तत्वों में लगाई गई और आवश्यक मात्रा लगभग बराबर है, और कोई मिट्टी-स्वास्थ्य या बहाव संबंधी चिंता नहीं पाई गई।"
risk.healthy.soil_health_impact:
  en: "This application pattern is not expected to degrade soil health."
  hi: "इस आवेदन पैटर्न से मिट्टी के स्वास्थ्य को नुकसान पहुंचने की उम्मीद नहीं है।"
risk.healthy.yield_impact:
  en: "This dose is expected to support the crop's yield potential without wasted input."
  hi: "इस खुराक से बिना किसी बर्बादी के फसल की उपज क्षमता को समर्थन मिलने की उम्मीद है।"

# rule.* -- R10 (ml/src/evaluation/explainability.py's explain()). One template per rule_id
# Saloni's npk_calculator.py / recommendation_engine.py actually emits into rule_trace --
# read directly from her code (src/engine/npk_calculator.py, recommendation_engine.py), not
# the prompt pack's placeholder list (which named rain_hold/split_stage rule_ids that don't
# actually exist -- rain-hold and split-schedule are applied straight to the schedule, never
# traced as a rule_trace item). The real set: dose_reference, soil_adjustment, dose_stcr,
# stcr_soil_adjustment, prior_credit, credit_skipped_no_efficiency,
# credit_ignored_unknown_product, classifier_disagreement.

rule.dose_reference:
  en: "The standard {irrigation} dose for {crop} is {value} kg/ha of {nutrient_label}."
  hi: "{crop} के लिए मानक {irrigation} खुराक {nutrient_label} की {value} किग्रा/हेक्टेयर है।"
rule.soil_adjustment:
  en: "Your soil {nutrient_label} tests {soil_rating} ({value} kg/ha), so {effect} is adjusted into the dose."
  hi: "आपकी मिट्टी में {nutrient_label} {soil_rating} स्तर पर है ({value} किग्रा/हेक्टेयर), इसलिए खुराक में {effect} का समायोजन किया गया है।"
rule.dose_stcr:
  en: "For a target yield of {target_yield_q_ha} q/ha, the soil-test crop-response equation calls for {value} kg/ha of {nutrient_label}."
  hi: "{target_yield_q_ha} क्विंटल/हेक्टेयर के लक्ष्य उत्पादन के लिए, मृदा-परीक्षण फसल-प्रतिक्रिया समीकरण {nutrient_label} की {value} किग्रा/हेक्टेयर मांग करता है।"
rule.stcr_soil_adjustment:
  en: "Your soil {nutrient_label} test result of {value} kg/ha adjusts that STCR dose by {effect}."
  hi: "आपकी मिट्टी में {nutrient_label} का परीक्षण परिणाम {value} किग्रा/हेक्टेयर उस STCR खुराक को {effect} से समायोजित करता है।"
rule.prior_credit:
  en: "You already applied about {raw_kg_ha} kg/ha of {nutrient_label}-containing fertilizer recently; at this crop's nutrient-use efficiency, that credits {value} kg/ha against the new dose."
  hi: "आपने हाल ही में लगभग {raw_kg_ha} किग्रा/हेक्टेयर {nutrient_label}-युक्त उर्वरक पहले से डाला है; इस फसल की पोषक-उपयोग दक्षता पर, इससे नई खुराक में {value} किग्रा/हेक्टेयर की छूट मिलती है।"
rule.credit_skipped_no_efficiency:
  en: "No nutrient-use-efficiency data exists yet for this crop's {nutrient_label}, so the {value} kg/ha already applied could not be credited against the new dose."
  hi: "इस फसल के {nutrient_label} के लिए अभी तक कोई पोषक-उपयोग-दक्षता डेटा उपलब्ध नहीं है, इसलिए पहले से डाले गए {value} किग्रा/हेक्टेयर को नई खुराक में शामिल नहीं किया जा सका।"
rule.credit_ignored_unknown_product:
  en: "Some previously logged fertilizer ({unknown_product_ids}) isn't in our product records, so it was left out of both the credit and the cost calculation."
  hi: "पहले दर्ज किया गया कुछ उर्वरक ({unknown_product_ids}) हमारे उत्पाद रिकॉर्ड में नहीं है, इसलिए इसे क्रेडिट और लागत दोनों गणनाओं से बाहर रखा गया।"
rule.classifier_disagreement:
  en: "The prediction model's top guess for this field was {classifier_choice}, but the soil-test calculation recommends {balance_choice} instead -- the calculated dose is what's used."
  hi: "इस खेत के लिए मॉडल का सबसे संभावित अनुमान {classifier_choice} था, लेकिन मिट्टी-परीक्षण गणना {balance_choice} की सिफारिश करती है -- उपयोग की गई गणना वही है।"

# rule.product_choice.* -- one sentence naming the single input that most drove the
# classifier's product pick. Two methods depending on the ACTIVE model
# (src/models/model_registry/registry.json), since only XGBoost has a native per-row
# attribution API -- random_forest is the currently locked-in production model (see
# PROGRESS.md), not XGBoost, so this can't assume pred_contribs is always available.
rule.product_choice.pred_contribs:
  en: "For the product choice, the strongest per-field signal was {feature_label} ({feature_value}), pointing the model toward {product}."
  hi: "उत्पाद चयन के लिए, सबसे मजबूत संकेत {feature_label} ({feature_value}) था, जिसने मॉडल को {product} की ओर इंगित किया।"
rule.product_choice.feature_importance:
  en: "Across its training data, the model's single most influential input for product choice is {feature_label} -- for this field, that value is {feature_value}."
  hi: "अपने प्रशिक्षण डेटा में, उत्पाद चयन के लिए मॉडल का सबसे प्रभावशाली इनपुट {feature_label} है -- इस खेत के लिए, वह मान {feature_value} है।"

# --- What a field's earlier soil tests say (engine/history.py) ---
history.soil_jump:
  en: "{label} reads {now} {unit} now, against {before} {unit} on {date}. That is a big change for soil in a short time, so check the report before relying on this plan."
  hi: "{label} अब {now} {unit} है, जबकि {date} को यह {before} {unit} था। मिट्टी में इतने कम समय में इतना बड़ा बदलाव कम ही होता है, इसलिए इस योजना पर भरोसा करने से पहले रिपोर्ट दोबारा जाँच लें।"
history.rating_dropped:
  en: "{label} has dropped from {before_rating} to {now_rating} since your test on {date} ({before} to {now} {unit}). The plan uses the {now_rating} rating."
  hi: "{date} की जाँच के बाद से {label} {before_rating} से घटकर {now_rating} हो गया है ({before} से {now} {unit})। योजना {now_rating} श्रेणी के अनुसार बनी है।"
history.rating_improved:
  en: "{label} has risen from {before_rating} to {now_rating} since your test on {date} ({before} to {now} {unit})."
  hi: "{date} की जाँच के बाद से {label} {before_rating} से बढ़कर {now_rating} हो गया है ({before} से {now} {unit})।"
history.oc_falling:
  en: "Organic carbon has fallen from {first}% to {now}% across {n} tests since {date}. Farmyard manure or compost helps rebuild it."
  hi: "{date} से {n} जाँचों में जैविक कार्बन {first}% से घटकर {now}% रह गया है। गोबर की खाद या कम्पोस्ट इसे फिर से बढ़ाने में मदद करती है।"
