# Render Blueprint for AgroBloom: Postgres, the ML service, the backend and the website.
# In Render: New > Blueprint > pick this repository. Render asks for the values marked
# `sync: false` (they depend on the URLs Render gives the services); docs/DEPLOYMENT.md has the
# order and the exact values. The default way to run the project is still docker-compose.
databases:
  - name: agrobloom-db
    databaseName: agrobloom
    user: agrobloom
    plan: free

services:
  # Dose engine. Stateless; it never touches the database.
  - type: web
    name: agrobloom-ml
    runtime: docker
    dockerfilePath: ./ml/Dockerfile
    dockerContext: ./ml
    healthCheckPath: /health
    plan: free
    envVars:
      - key: PORT
        value: "8001"
      - key: PREDICT_MODE
        value: real
      - key: DATA_EXTERNAL_DIR
        value: data/external
      - key: MODEL_ARTIFACT_DIR
        value: models_artifacts
      # Answer requests while the classifier (scikit-learn, most of the start-up time) loads in the background.
      # A plan does not need it. Without this a cold start waits for it first.
      - key: ML_LOAD_MODEL_IN_BACKGROUND
        value: "true"

  # API. The image applies database migrations on every start.
  - type: web
    name: agrobloom-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: agrobloom-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 7d
      - key: ML_MODE
        value: online
      # Free instances sleep when idle; the first call after a pause can take about a minute.
      - key: ML_TIMEOUT_MS
        value: "90000"
      - key: WEATHER_SERVICE_URL
        value: https://api.open-meteo.com/v1
      - key: GEOCODE_SERVICE_URL
        value: https://geocoding-api.open-meteo.com/v1
      # Public URL of agrobloom-ml, for example https://agrobloom-ml.onrender.com
      - key: ML_SERVICE_URL
        sync: false
      # Public URL of the website (agrobloom-web), for example https://agrobloom-web.onrender.com
      - key: CORS_ORIGIN
        sync: false

  # Website: a static build. Every path falls back to index.html so client-side routes load.
  - type: web
    name: agrobloom-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # Built files have hashed names, so browsers may keep them for a year; the page itself is
    # always re-checked so a new deploy shows up straight away.
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
    envVars:
      - key: VITE_USE_MOCK
        value: "false"
      # The API and then the ML service may both be asleep: allow for two cold starts.
      - key: VITE_API_TIMEOUT_MS
        value: "180000"
      # Public URL of agrobloom-api plus /api, for example https://agrobloom-api.onrender.com/api
      - key: VITE_API_BASE_URL
        sync: false
